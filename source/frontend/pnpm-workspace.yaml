packages:
  - "."

# The lockfile is generated on Windows but the production image is Linux
# amd64/glibc. Keep both host and deployment native optional packages so Vite's
# Rolldown binding is present in a frozen Docker install.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false

ignoredBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"

overrides:
  "tailwindcss>nanoid": "3.3.7"
